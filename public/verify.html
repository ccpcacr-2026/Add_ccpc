<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Verify Application — Chattogram Cantonment Public College</title>
<style>
  :root{
    --navy:#0f2c4d; --navy-2:#173e69; --ink:#12202f; --muted:#5b6b7d;
    --line:#e2e8f0; --paper:#f3f6fa; --surface:#ffffff;
    --accent:#0f8a6d; --accent-soft:#e2f5ef;
    --gold:#c9922b; --danger:#c0392b; --danger-soft:#fdecea; --ok:#0f8a6d; --ok-soft:#e2f5ef;
    --shadow:0 1px 2px rgba(15,44,77,.06), 0 10px 30px rgba(15,44,77,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;min-height:100vh}
  .top{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;padding:16px 20px;display:flex;align-items:center;gap:14px}
  .top img{width:42px;height:42px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#fff;border:1px solid rgba(255,255,255,.3)}
  .top h1{font-size:15px;margin:0;font-weight:800;letter-spacing:.01em}
  .top p{font-size:11.5px;margin:2px 0 0;opacity:.8}
  .wrap{max-width:460px;margin:0 auto;padding:28px 16px 60px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:24px;text-align:center}
  .state-icon{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:28px}
  .ok .state-icon{background:var(--ok-soft);color:var(--ok)}
  .bad .state-icon{background:var(--danger-soft);color:var(--danger)}
  .state-title{font-size:17px;font-weight:800;margin:0 0 4px}
  .ok .state-title{color:var(--ok)}
  .bad .state-title{color:var(--danger)}
  .state-sub{font-size:12.5px;color:var(--muted);margin:0 0 20px}
  .photo{width:84px;height:96px;object-fit:cover;border-radius:10px;border:2px solid var(--line);margin:0 auto 16px;display:block}
  table{width:100%;border-collapse:collapse;text-align:left}
  table td{padding:7px 2px;font-size:13px;border-bottom:1px solid var(--line)}
  table td:first-child{color:var(--muted);font-weight:700;width:40%;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em}
  table tr:last-child td{border-bottom:none}
  .loading{color:var(--muted);font-size:13px;padding:30px 0}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="top">
  <img src="/logo.jpg" alt="CCPC">
  <div>
    <h1>Chattogram Cantonment Public College</h1>
    <p>Application / Admit Card Verification</p>
  </div>
</div>
<div class="wrap">
  <div class="card" id="card">
    <div class="loading">Verifying…</div>
  </div>
  <div class="foot">Scanned from a QR code printed on an official document.</div>
</div>
<script>
(async function(){
  const q = new URLSearchParams(location.search);
  const code = (q.get('code') || '').trim();
  const card = document.getElementById('card');
  function render(ok, title, sub, app){
    card.className = ok ? 'card ok' : 'card bad';
    let html = `<div class="state-icon">${ok ? '✓' : '✕'}</div>`
      + `<div class="state-title">${title}</div>`
      + `<div class="state-sub">${sub}</div>`;
    if (app) {
      if (app.student_photo) html += `<img class="photo" src="${app.student_photo}" alt="Photo">`;
      const rows = [
        ['Name', app.name_english],
        ['Name (Bangla)', app.name_bangla],
        ['Tracking ID', app.tracking_id],
        ['Index ID', app.index_id],
        ['Class', app.class],
        ['Category', app.category],
        ['Version', app.version],
        ['Session', app.session],
        ['Status', app.status],
      ].filter(r => r[1]);
      html += '<table>' + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') + '</table>';
    }
    card.innerHTML = html;
  }
  if (!code) return render(false, 'No code provided', 'This link is missing a verification code.');
  let r;
  try {
    r = await (await fetch('/api/exec', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'publicVerify', payload: { code } }),
    })).json();
  } catch { return render(false, 'Could not verify', 'Check your connection and try again.'); }
  if (!r.verified) return render(false, 'Not Found', r.error || 'No matching application found for this code.');
  render(true, 'Verified', 'This is a genuine Chattogram Cantonment Public College record.', r.application);
})();
</script>
</body>
</html>
